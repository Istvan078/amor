<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img" aria-label="First spark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10222c"/>
      <stop offset="1" stop-color="#171427"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset=".52" stop-color="#ff8fb1"/>
      <stop offset="1" stop-color="#35c6bd"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="320" height="220" rx="22" fill="url(#bg)"/>
  <g transform="translate(160 110)" filter="url(#glow)">
    <path d="M0 -72 L14 -18 L68 -2 L14 14 L0 72 L-14 14 L-68 -2 L-14 -18Z" fill="url(#spark)">
      <animateTransform attributeName="transform" type="rotate" values="0;18;0;-18;0" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".78;1;.78" dur="1s" repeatCount="indefinite"/>
    </path>
    <circle r="18" fill="#ffffff" opacity=".22">
      <animate attributeName="r" values="14;34;14" dur="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".28;.04;.28" dur="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M62 164 C98 133 111 180 146 148 C176 120 198 156 242 104" fill="none" stroke="#ff8fb1" stroke-width="5" stroke-linecap="round" opacity=".78">
    <animate attributeName="stroke-dasharray" values="1 180;80 80;1 180" dur="1.7s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="0;-70;-160" dur="1.7s" repeatCount="indefinite"/>
  </path>
</svg>
